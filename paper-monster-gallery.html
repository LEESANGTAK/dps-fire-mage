<!doctype html><html lang="ko"><meta charset="utf-8"><title>페이퍼크래프트 몬스터 원화 전체</title><style>
body{margin:0;padding:24px;background:#26292d;color:#eee;font:14px sans-serif}h1{font-size:20px;margin:0 0 20px}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;max-width:1200px;margin:auto}.card{background:#42494d;border:1px solid #788078;border-radius:10px;height:220px;display:flex;flex-direction:column;align-items:center;justify-content:end;overflow:hidden}.sprite{background-repeat:no-repeat;flex-shrink:0;filter:drop-shadow(2px 4px 2px #0004)}.label{margin:16px 0;font-size:13px;color:#efe4cb}canvas{width:170px;height:170px;object-fit:contain}h1{text-align:center}
</style><h1>페이퍼크래프트 몬스터 · 22종</h1><main id="gallery"></main><script src="paper-art.js"></script><script src="paper-monster-frames.js"></script><script>
const samples=[{"stage": 1, "name": "초원 풀숲 슬라임", "emoji": "🟢"}, {"stage": 2, "name": "푸른 늪지 슬라임", "emoji": "🔵"}, {"stage": 3, "name": "들판 거대 들쥐", "emoji": "🐀"}, {"stage": 4, "name": "고블린 정찰병", "emoji": "👺"}, {"stage": 5, "name": "붉은송곳니 군주", "emoji": "🐗"}, {"stage": 6, "name": "잿빛 숲 늑대", "emoji": "🐺"}, {"stage": 7, "name": "놀 야수사냥꾼", "emoji": "🏹"}, {"stage": 8, "name": "폐광 해골 광부", "emoji": "💀"}, {"stage": 9, "name": "맹독 모래전갈", "emoji": "🦂"}, {"stage": 10, "name": "동굴 오우거 대족장", "emoji": "👹"}, {"stage": 11, "name": "화염 비늘 도마뱀", "emoji": "🦎"}, {"stage": 12, "name": "심연 흡혈박쥐", "emoji": "🦇"}, {"stage": 13, "name": "고대 바위 파수꾼", "emoji": "🗿"}, {"stage": 14, "name": "타락한 어둠마법사", "emoji": "🧙"}, {"stage": 15, "name": "붉은 화염 비룡", "emoji": "🐉"}, {"stage": 16, "name": "저주받은 기사단원", "emoji": "⚔️"}, {"stage": 17, "name": "원한 서린 밴시", "emoji": "👻"}, {"stage": 18, "name": "지하군주 거대거미", "emoji": "🕷️"}, {"stage": 19, "name": "심연의 파멸수호병", "emoji": "👿"}, {"stage": 20, "name": "화염군주 라그나로스", "emoji": "🔥"},{"stage":21,"name":"심연 추적자","emoji":"👿"},{"stage":25,"name":"심연 전령","emoji":"👿"}];
const slimeImage=new Image();slimeImage.src='assets/art/paper-slime-poses.png';
function render(){const root=document.querySelector('#gallery');for(const m of samples){const card=document.createElement('div');card.className='card';if(m.stage<=2){const canvas=document.createElement('canvas');canvas.width=canvas.height=640;const f=PAPER_ART_FRAMES.slime.idle;canvas.getContext('2d').drawImage(slimeImage,...f.box,25,25,590,587);if(m.stage===2)canvas.style.filter='hue-rotate(85deg)';card.append(canvas);}else{const f=getPaperMonsterFrame(m.stage),scale=Math.min(170/f.w,170/f.h),sprite=document.createElement('div');sprite.className='sprite';Object.assign(sprite.style,{width:`${f.w*scale}px`,height:`${f.h*scale}px`,backgroundImage:`url('${f.sheet}')`,backgroundSize:`${f.size[0]*scale}px ${f.size[1]*scale}px`,backgroundPosition:`${-f.x*scale}px ${-f.y*scale}px`,clipPath:f.clip});card.append(sprite);}const label=document.createElement('div');label.className='label';label.textContent=m.name;card.append(label);root.append(card);}}
slimeImage.onload=render;
</script></html>
