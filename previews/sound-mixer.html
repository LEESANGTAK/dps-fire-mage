<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>효과음 믹싱</title>
<!-- 개발용 믹싱 페이지. 게임과 같은 믹서(src/scripts/sound-mixer.js)로 소리를 내며 믹스 표(SFX_MIX)의 dB를 귀로 맞춥니다.
     게임 서버(.claude/launch.json의 game, 저장소 루트)에서 http://localhost:8765/previews/sound-mixer.html 로 엽니다.
     여기서 바꾼 값은 이 브라우저에만 저장되고, 게임에 넣으려면 SFX_MIX에 옮겨 적어야 합니다(에이전트가 readMix()로 읽어 반영). -->
<style>
  :root { --bg:#17121a; --card:#221a26; --line:#3a2f40; --ink:#f3e9dc; --mute:#a99bae; --fire:#ff8a3d; --up:#ffb46b; --down:#7fb6ff; --warn:#ff6b6b; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 "Malgun Gothic", system-ui, sans-serif; }
  header { position:sticky; top:0; z-index:2; background:#1d1621ee; backdrop-filter:blur(4px); border-bottom:1px solid var(--line); padding:12px 16px; }
  h1 { font-size:18px; margin:0 0 8px; }
  .bar { display:flex; flex-wrap:wrap; gap:10px 18px; align-items:center; }
  .bar label { display:flex; gap:6px; align-items:center; color:var(--mute); }
  .bar b { color:var(--ink); min-width:38px; display:inline-block; }
  button { background:#2f2534; color:var(--ink); border:1px solid var(--line); border-radius:6px; padding:5px 10px; cursor:pointer; font:inherit; }
  button:hover { border-color:var(--fire); }
  button.scene { background:#3a2a1c; border-color:#6b4a2c; }
  button.on { background:var(--fire); color:#1b120c; }
  main { display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:16px; padding:16px; max-width:1240px; margin:0 auto; }
  @media (max-width:900px) { main { grid-template-columns:1fr; } }
  section.bus { background:var(--card); border:1px solid var(--line); border-radius:10px; margin-bottom:14px; overflow:hidden; }
  .bus-head { display:flex; gap:10px; align-items:center; padding:8px 12px; background:#2a2030; }
  .bus-head h2 { font-size:15px; margin:0; flex:1; }
  .row { display:grid; grid-template-columns:34px minmax(110px,1.1fr) minmax(120px,2fr) 64px 58px 28px; gap:8px; align-items:center; padding:5px 12px; border-top:1px solid #2c2331; }
  .row.changed { background:#2c2018; }
  .row .name small { display:block; color:var(--mute); font-size:11px; font-family:Consolas, monospace; }
  .row input[type=range] { width:100%; accent-color:var(--fire); }
  .row input[type=number] { width:64px; background:#140f17; color:var(--ink); border:1px solid var(--line); border-radius:4px; padding:3px; }
  .delta { font-size:12px; text-align:right; color:var(--mute); }
  .delta.up { color:var(--up); } .delta.down { color:var(--down); }
  .play { width:30px; height:28px; padding:0; }
  .reset { padding:0 4px; height:24px; color:var(--mute); }
  aside { position:sticky; top:150px; align-self:start; }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:14px; }
  .panel h3 { margin:0 0 8px; font-size:14px; }
  .ladder div { display:grid; grid-template-columns:96px 1fr 42px; gap:6px; align-items:center; font-size:12px; margin:2px 0; }
  .ladder .meter { height:8px; border-radius:4px; background:#2c2331; position:relative; overflow:hidden; }
  .ladder .meter i { position:absolute; inset:0 auto 0 0; background:linear-gradient(90deg,#6b4a2c,var(--fire)); border-radius:4px; }
  .ladder .hot i { background:linear-gradient(90deg,#8a3a2c,var(--warn)); }
  .muted { color:var(--mute); font-size:12px; }
  #changes li { font-size:12px; }
  .note { color:var(--mute); font-size:12px; margin:6px 0 0; }
</style>
</head>
<body>
<header>
  <h1>효과음 믹싱 · 일반 화염구 적중 = 0dB</h1>
  <div class="bar">
    <label>효과음 슬라이더 <input id="sfx" type="range" min="0" max="100" step="1" value="10"> <b id="sfx-v">10%</b></label>
    <label>마스터 <input id="master" type="range" min="0" max="100" step="1" value="100"> <b id="master-v">100%</b></label>
    <label><button id="bgm-toggle">배경음 끔</button> <input id="bgm" type="range" min="0" max="100" step="1" value="20"> <b id="bgm-v">20%</b></label>
    <span class="muted">장면:</span>
    <button class="scene" data-scene="combat">전투 연사</button>
    <button class="scene" data-scene="meteor">메테오</button>
    <button class="scene" data-scene="reward">처치·보상</button>
    <button class="scene" data-scene="ui">카드·메뉴</button>
    <button class="scene" data-scene="prop">배경 소품</button>
    <button id="reset-all">전부 원래대로</button>
  </div>
  <p class="note">+6dB ≈ 두 배, -6dB ≈ 절반. 게임 기본 효과음 10%·배경음 20%. 숫자를 바꾸면 바로 반영되고 이 브라우저에 저장됩니다.</p>
</header>
<main>
  <div id="buses"></div>
  <aside>
    <div class="panel"><h3>크기 사다리 (큰 순)</h3><div class="ladder" id="ladder"></div>
      <p class="note">막대 = 지금 슬라이더에서 실제로 곱해지는 배율. 붉은 막대는 1을 넘어 리미터가 누를 수 있는 소리.</p></div>
    <div class="panel"><h3>바꾼 값</h3><ul id="changes"></ul></div>
  </aside>
</main>
<script src="../src/scripts/sfx-loudness.js"></script>
<script src="../src/scripts/sound-mixer.js"></script>
<script>
const BUS_LABELS = { combat: '전투(화염구)', meteor: '메테오', reward: '보상·강조', ui: '카드·메뉴 UI', alert: '알림', prop: '배경 소품' };
const CUE_LABELS = {
  launch: '화염구 발사(수동)', fireball_fly: '화염구 비행', hit: '일반 적중', crit: '치명타 적중', crit_heat: '붉은 치명타(열기 충전)', flame_patch_burst: '불장판 펑',
  cast_loop: '시전 충전(반복)', burn_loop: '지속 연소(반복)',
  meteor_fly: '메테오 낙하', meteor_fly_small: '작은 메테오 낙하', meteor_explosion: '메테오 폭발',
  item_select: '선택 딸깍', drop_coin: '골드 획득', celebrate: '축하 차임', proc: '발동 차임', monster_destroy: '몬스터 처치', summon_spirit: '정령 소환',
  card_hover: '카드 호버', card_deal: '카드 돌리기', card_stamp: '카드 도장', card_shuffle: '카드 섞기', buy_denied: '구매 거절', button_hover: '버튼 호버', popup_open: '팝업 열림',
  enrage_tick: '광폭화 째깍', run_defeat: '패배',
  prop_crystal_tap: '수정 두드림', prop_crystal_break: '수정 깨짐', prop_brazier: '화로 치솟음', prop_sigil: '옥좌 점등', prop_lantern: '랜턴 흔들림', prop_relight: '랜턴 재점화',
  prop_cart: '광차 덜컹', prop_cart_spill: '광석 쏟아짐', prop_banner: '깃발 펄럭', prop_chime: '공허 수정 음', prop_peek: '아치 속 눈', prop_slime: '새끼 슬라임'
};
const LOOP_CUES = new Set(['cast_loop', 'burn_loop']);
const STORE_KEY = 'dps-sfx-mix-draft-v1';

// 게임 표의 원본과, 이 페이지에서 고치는 사본
const ORIGINAL_MIX = JSON.parse(JSON.stringify(SFX_MIX));
const ORIGINAL_BUSES = { ...SFX_BUSES };
const mix = JSON.parse(JSON.stringify(SFX_MIX));
const buses = { ...SFX_BUSES };
try {
  const saved = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
  if (saved) {
    for (const [k, v] of Object.entries(saved.cues || {})) if (mix[k]) mix[k].db = v;
    for (const [k, v] of Object.entries(saved.buses || {})) if (k in buses) buses[k] = v;
  }
} catch (e) { /* 저장 없음 */ }
function save() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify({
      cues: Object.fromEntries(Object.entries(mix).map(([k, v]) => [k, v.db])),
      buses
    }));
  } catch (e) { /* 저장 불가(사생활 모드 등) */ }
}

// 페이지는 previews/ 안에 있어 파일 경로 앞에 ../ 를 붙입니다(측정값도 같은 키로).
const up = (p) => '../' + p;
const files = Object.fromEntries(Object.entries(SFX_FILES).map(([k, v]) => [k, Array.isArray(v) ? v.map(up) : up(v)]));
const loudness = Object.fromEntries(Object.entries(SFX_LOUDNESS).map(([k, v]) => [up(k), v]));

const vol = { sfx: 0.1, master: 1, bgm: 0.2 };
const userVolume = () => vol.sfx * vol.master;
const mixer = createSoundMixer({ files, mix, buses, loudness, getVolume: userVolume });
mixer.load();

// 배경음: 게임과 같은 계산(마스터 × 배경음 슬라이더)
const bgm = new Audio('../assets/sounds/bgm/Iron_Underneath.mp3');
bgm.loop = true;
let bgmOn = false;
function applyBgm() { bgm.volume = Math.min(1, vol.master * vol.bgm); }

// 반복음은 2.5초 켰다 끕니다.
const loops = {};
function playCue(cue, opts = {}) {
  mixer.resume();
  if (LOOP_CUES.has(cue)) {
    const l = loops[cue] || (loops[cue] = mixer.loop(cue));
    if (!l) return;
    l.update(true);
    clearTimeout(l.timer);
    l.timer = setTimeout(() => l.update(false), 2500);
    return;
  }
  mixer.play(cue, opts);
}

// 장면: 게임에서 실제로 겹치는 순서·간격을 흉내 냅니다(초).
const SCENES = {
  combat: [[0, 'cast_loop'], [0.1, 'fireball_fly'], [0.35, 'hit'], [0.55, 'fireball_fly'], [0.8, 'hit'], [1.0, 'fireball_fly'], [1.25, 'crit_heat', 1.0],
    [1.45, 'fireball_fly'], [1.7, 'crit_heat', 1.15], [1.9, 'burn_loop'], [2.0, 'fireball_fly'], [2.25, 'hit'], [2.6, 'flame_patch_burst']],
  meteor: [[0, 'meteor_fly', 1, 0.4], [1.0, 'meteor_explosion'], [1.2, 'hit'], [1.5, 'crit'], [2.3, 'meteor_fly_small', 1, 0.6], [3.1, 'meteor_explosion', 1.06]],
  reward: [[0, 'crit'], [0.25, 'monster_destroy'], [0.6, 'drop_coin', 1.0], [0.75, 'drop_coin', 1.12], [0.9, 'drop_coin', 1.25], [1.4, 'celebrate'], [2.2, 'proc'], [2.9, 'summon_spirit']],
  ui: [[0, 'button_hover'], [0.3, 'popup_open'], [0.9, 'card_shuffle'], [1.3, 'card_deal'], [1.45, 'card_deal'], [1.6, 'card_deal'], [2.0, 'card_hover'], [2.3, 'card_hover'], [2.7, 'card_stamp'], [3.1, 'item_select'], [3.5, 'buy_denied'], [4.0, 'enrage_tick'], [5.0, 'enrage_tick', 1.2]],
  prop: [[0, 'prop_crystal_tap', 1.44], [0.35, 'prop_crystal_tap', 1.53], [0.7, 'prop_crystal_break', 1.2], [1.4, 'prop_brazier'], [1.9, 'prop_sigil'], [2.7, 'prop_lantern'], [3.0, 'prop_relight'],
    [3.5, 'prop_cart'], [3.9, 'prop_cart_spill'], [4.6, 'prop_banner'], [5.0, 'prop_chime', 1.0], [5.25, 'prop_chime', 1.12], [5.5, 'prop_chime', 1.26], [6.0, 'prop_peek'], [6.4, 'prop_slime']]
};
function playScene(name) {
  mixer.resume();
  for (const [t, cue, pitch = 1, offset] of SCENES[name]) {
    setTimeout(() => playCue(cue, { pitch, offset }), t * 1000);
  }
}

// ---- 화면 ----
const fmt = (db) => (db > 0 ? '+' : '') + db.toFixed(1);
const busesEl = document.getElementById('buses');
const rows = {};
for (const bus of Object.keys(SFX_BUSES)) {
  const sec = document.createElement('section');
  sec.className = 'bus';
  sec.innerHTML = `<div class="bus-head"><h2>${BUS_LABELS[bus] || bus}</h2>
    <span class="muted">무리 전체</span><input type="range" min="-12" max="12" step="0.5" data-bus="${bus}" style="width:140px;accent-color:#ff8a3d">
    <input type="number" step="0.5" data-bus="${bus}" style="width:60px;background:#140f17;color:#f3e9dc;border:1px solid #3a2f40;border-radius:4px"></div>`;
  for (const [cue, c] of Object.entries(mix).filter(([, c]) => c.bus === bus)) {
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `<button class="play" title="듣기">▶</button>
      <div class="name">${CUE_LABELS[cue] || cue}<small>${cue}</small></div>
      <input type="range" min="-36" max="24" step="0.5">
      <input type="number" step="0.5">
      <span class="delta"></span>
      <button class="reset" title="원래대로">↺</button>`;
    row.querySelector('.play').addEventListener('click', () => playCue(cue));
    const range = row.querySelector('input[type=range]'), num = row.querySelector('input[type=number]');
    const set = (v) => { const n = Number(v); if (!Number.isFinite(n)) return; mix[cue].db = Math.round(n * 2) / 2; save(); render(); };
    range.addEventListener('input', () => set(range.value));
    range.addEventListener('change', () => playCue(cue));
    num.addEventListener('change', () => { set(num.value); playCue(cue); });
    row.querySelector('.reset').addEventListener('click', () => { set(ORIGINAL_MIX[cue].db); playCue(cue); });
    rows[cue] = { row, range, num, delta: row.querySelector('.delta') };
    sec.appendChild(row);
  }
  for (const input of sec.querySelectorAll('[data-bus]')) {
    input.addEventListener(input.type === 'range' ? 'input' : 'change', () => { buses[bus] = Math.round(Number(input.value) * 2) / 2 || 0; save(); render(); });
  }
  busesEl.appendChild(sec);
}

function render() {
  for (const [cue, r] of Object.entries(rows)) {
    const db = mix[cue].db, d = db - ORIGINAL_MIX[cue].db;
    if (document.activeElement !== r.num) r.num.value = db;
    r.range.value = db;
    r.delta.textContent = d ? fmt(d) : '';
    r.delta.className = 'delta' + (d > 0 ? ' up' : d < 0 ? ' down' : '');
    r.row.classList.toggle('changed', d !== 0);
  }
  for (const input of document.querySelectorAll('[data-bus]')) if (document.activeElement !== input) input.value = buses[input.dataset.bus];
  // 크기 사다리: 표 dB + 무리 dB, 실제 배율은 파일 보정까지 포함한 평균
  const items = Object.keys(mix).map((cue) => {
    const list = [].concat(files[mix[cue].sound]);
    const gain = list.reduce((a, f) => a + mixer.gainOf(cue, f), 0) / list.length * userVolume();
    return { cue, db: mix[cue].db + (buses[mix[cue].bus] || 0), gain };
  }).sort((a, b) => b.db - a.db);
  const top = Math.max(1.2, ...items.map((i) => i.gain));
  document.getElementById('ladder').innerHTML = items.map((i) => `<div><span>${CUE_LABELS[i.cue] || i.cue}</span>
    <span class="meter${i.gain > 1 ? ' hot' : ''}"><i style="width:${Math.min(100, i.gain / top * 100)}%"></i></span><span>${fmt(i.db)}</span></div>`).join('');
  const changed = readMix();
  const lines = Object.entries(changed.cues).map(([cue, v]) => `<li>${CUE_LABELS[cue] || cue}: ${fmt(v.from)} → ${fmt(v.to)}</li>`)
    .concat(Object.entries(changed.buses).map(([bus, v]) => `<li>[무리] ${BUS_LABELS[bus]}: ${fmt(v.from)} → ${fmt(v.to)}</li>`));
  document.getElementById('changes').innerHTML = lines.join('') || '<li class="muted">아직 없음</li>';
}

// 에이전트가 읽어 SFX_MIX에 반영하는 값(바뀐 것만).
function readMix() {
  const cues = {}, busOut = {};
  for (const [k, v] of Object.entries(mix)) if (v.db !== ORIGINAL_MIX[k].db) cues[k] = { from: ORIGINAL_MIX[k].db, to: v.db };
  for (const [k, v] of Object.entries(buses)) if (v !== ORIGINAL_BUSES[k]) busOut[k] = { from: ORIGINAL_BUSES[k], to: v };
  return { cues, buses: busOut, sfxSlider: vol.sfx, mode: mixer.mode, loaded: mixer.loadedCount };
}
window.readMix = readMix;

function bindSlider(id, key, after) {
  const el = document.getElementById(id), out = document.getElementById(id + '-v');
  el.addEventListener('input', () => { vol[key] = el.value / 100; out.textContent = el.value + '%'; if (after) after(); render(); });
}
bindSlider('sfx', 'sfx');
bindSlider('master', 'master', applyBgm);
bindSlider('bgm', 'bgm', applyBgm);
document.getElementById('bgm-toggle').addEventListener('click', (e) => {
  bgmOn = !bgmOn;
  e.target.textContent = bgmOn ? '배경음 켬' : '배경음 끔';
  e.target.classList.toggle('on', bgmOn);
  applyBgm();
  if (bgmOn) bgm.play().catch(() => {}); else bgm.pause();
});
for (const b of document.querySelectorAll('[data-scene]')) b.addEventListener('click', () => playScene(b.dataset.scene));
document.getElementById('reset-all').addEventListener('click', () => {
  for (const k of Object.keys(mix)) mix[k].db = ORIGINAL_MIX[k].db;
  Object.assign(buses, ORIGINAL_BUSES);
  save(); render();
});
render();
</script>
</body>
</html>
