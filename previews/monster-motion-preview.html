<!doctype html><html lang="ko"><meta charset="utf-8"><title>몬스터 재질별 모션 비교</title><link rel="stylesheet" href="../src/styles/styles.css"><link rel="stylesheet" href="../src/styles/art.css?v=paper-monsters-1"><style>
body{display:block;padding:24px;background:#17131b;color:#eee;font-family:sans-serif} main{max-width:900px;margin:auto}h1{font-size:22px} .controls{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}button,select{padding:12px;background:#352838;color:#ffe7b0;border:1px solid #795942;border-radius:8px} .combat-arena{position:relative;height:360px;min-height:360px;width:100%;overflow:hidden}#dummy-avatar{position:absolute;left:calc(50% - 63px);top:175px;margin:0;bottom:auto}#sample-name{position:absolute;bottom:18px;left:0;right:0;text-align:center}canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}p{color:#b8afbc}
</style><main><h1>몬스터 재질별 모션 비교</h1><div class="controls"><select id="monster-select" aria-label="몬스터 선택"></select><button id="normal-hit">일반 타격</button><button id="crit-hit">강한 타격</button><button id="death-hit">처치</button></div><div class="combat-arena" id="combat-arena"><div class="dummy-avatar" id="dummy-avatar"><div class="monster-idle"><div class="dummy-emoji" id="dummy-emoji"></div></div></div><canvas id="preview-vfx"></canvas><div id="sample-name"></div></div><p>종이 몬스터의 대기·피격·사망을 비교합니다. 슬라임은 4포즈, 나머지는 원화 1장과 정지 포즈 변형을 사용합니다.</p></main><script src="../src/scripts/combat-art.js?v=edge-splash-1"></script><script src="../src/scripts/comic-monster-frames.js?v=comic-ui-2"></script><script src="../src/scripts/paper-art.js?v=paper-monsters-1"></script><script src="../src/scripts/paper-monster-frames.js?v=paper-monsters-1"></script><script src="../src/scripts/comic-assets.js?v=paper-monsters-1"></script><script src="../src/scripts/monster-motion.js?v=paper-monsters-1"></script><script>
const samples=[{"stage": 1, "name": "초원 풀숲 슬라임", "emoji": "🟢"}, {"stage": 2, "name": "푸른 늪지 슬라임", "emoji": "🔵"}, {"stage": 3, "name": "들판 거대 들쥐", "emoji": "🐀"}, {"stage": 4, "name": "고블린 정찰병", "emoji": "👺"}, {"stage": 5, "name": "붉은송곳니 군주", "emoji": "🐗"}, {"stage": 6, "name": "잿빛 숲 늑대", "emoji": "🐺"}, {"stage": 7, "name": "놀 야수사냥꾼", "emoji": "🏹"}, {"stage": 8, "name": "폐광 해골 광부", "emoji": "💀"}, {"stage": 9, "name": "맹독 모래전갈", "emoji": "🦂"}, {"stage": 10, "name": "동굴 오우거 대족장", "emoji": "👹"}, {"stage": 11, "name": "화염 비늘 도마뱀", "emoji": "🦎"}, {"stage": 12, "name": "심연 흡혈박쥐", "emoji": "🦇"}, {"stage": 13, "name": "고대 바위 파수꾼", "emoji": "🗿"}, {"stage": 14, "name": "타락한 어둠마법사", "emoji": "🧙"}, {"stage": 15, "name": "붉은 화염 비룡", "emoji": "🐉"}, {"stage": 16, "name": "저주받은 기사단원", "emoji": "⚔️"}, {"stage": 17, "name": "원한 서린 밴시", "emoji": "👻"}, {"stage": 18, "name": "지하군주 거대거미", "emoji": "🕷️"}, {"stage": 19, "name": "심연의 파멸수호병", "emoji": "👿"}, {"stage": 20, "name": "화염군주 라그나로스", "emoji": "🔥"},{"stage":21,"name":"심연 추적자","emoji":"👿"},{"stage":25,"name":"심연 전령","emoji":"👿"}];
const particles=[];let stage=1,direction=0;
function getActorGroundPos(){const a=document.querySelector('#combat-arena').getBoundingClientRect(),b=document.querySelector('#dummy-avatar').getBoundingClientRect();return{x:b.left-a.left+b.width/2,y:b.bottom-a.top};}
const selector=document.querySelector('#monster-select');for(const m of samples){const o=document.createElement('option');o.value=m.stage;o.textContent=m.name;selector.appendChild(o);}
function show(){stage=Number(selector.value);const m=samples.find(m=>m.stage===stage);const e=document.querySelector('#dummy-emoji');e.textContent=m.emoji;e.dataset.art=stage<=2?'slime':'';e.dataset.variant=stage===2?'blue':'';document.querySelector('#dummy-avatar').className='dummy-avatar';configureMonsterMotion(stage);document.querySelector('#sample-name').textContent=m.name;}
selector.onchange=show;show();
function hit(strong){prepareMonsterHit(stage,strong,direction++%2,false);const a=document.querySelector('#dummy-avatar');a.className='dummy-avatar';void a.offsetWidth;a.classList.add(strong?'crit-right':'hit-right');}
document.querySelector('#normal-hit').onclick=()=>hit(false);document.querySelector('#crit-hit').onclick=()=>hit(true);document.querySelector('#death-hit').onclick=()=>spawnMaterialDeath(stage,false);
const canvas=document.querySelector('#preview-vfx'),ctx=canvas.getContext('2d');let previous=performance.now();function tick(now){const dt=Math.min(.05,(now-previous)/1000);previous=now;canvas.width=canvas.clientWidth;canvas.height=canvas.clientHeight;updatePaperSlime(dt,false);for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.life+=dt;if(p.life<0)continue;if(p.life>=p.maxLife){particles.splice(i,1);continue}p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.slimeDrop){drawSlimeDrop(ctx,p,dt);continue}p.vy+=p.materialChip?540*dt:0;ctx.globalAlpha=1-p.life/p.maxLife;ctx.fillStyle=p.colorCore;ctx.fillRect(p.x,p.y,p.radius*2,p.radius);ctx.globalAlpha=1;}requestAnimationFrame(tick)}requestAnimationFrame(tick);
</script></html>
